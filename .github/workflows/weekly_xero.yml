name: Weekly Xero Payroll Fill

on:
  workflow_dispatch:

jobs:
  fill:
    runs-on: ubuntu-latest

    env:
      GHL_API_KEY:       ${{ secrets.GHL_API_KEY }}
      GHL_LOCATION_ID:   ${{ secrets.GHL_LOCATION_ID }}
      XERO_CLIENT_ID:    ${{ secrets.XERO_CLIENT_ID }}
      XERO_CLIENT_SECRET: ${{ secrets.XERO_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Xero token from session repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git clone https://x-access-token:$GH_TOKEN@github.com/andrewmcdevitt-stack/xero-session.git /tmp/xero-session
          mkdir -p data
          cp /tmp/xero-session/xero_token.json data/xero_token.json

      - name: Fill payslip earnings (Xero API)
        run: python agent/xero_create_payrun.py

      - name: Save updated Xero token back to session repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f data/xero_token.json ]; then
            cp data/xero_token.json /tmp/xero-session/xero_token.json
          fi
          cd /tmp/xero-session
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add xero_token.json
          git diff --staged --quiet || git commit -m "Update Xero token $(date -u +%Y-%m-%d)"
          git push
