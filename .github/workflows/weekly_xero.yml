name: Weekly Xero Payroll Fill

on:
  workflow_dispatch:

jobs:
  fill:
    runs-on: ubuntu-latest

    env:
      GHL_API_KEY:        ${{ secrets.GHL_API_KEY }}
      GHL_LOCATION_ID:    ${{ secrets.GHL_LOCATION_ID }}
      XERO_CLIENT_ID:     ${{ secrets.XERO_CLIENT_ID }}
      XERO_CLIENT_SECRET: ${{ secrets.XERO_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Xero token
        run: |
          mkdir -p data
          echo "${{ secrets.XERO_TOKEN_B64 }}" | base64 --decode > data/xero_token.json

      - name: Fill payslip earnings (Xero API)
        run: python agent/xero_create_payrun.py

      - name: Save updated Xero token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f data/xero_token.json ]; then
            base64 -w 0 data/xero_token.json | gh secret set XERO_TOKEN_B64 --repo ${{ github.repository }}
          fi
